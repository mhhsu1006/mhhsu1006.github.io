<svg class="architecture-figure model-desktop" viewBox="0 0 1080 360" role="img" aria-labelledby="arch-title">
  <title id="arch-title">Speech is encoded by Whisper-large-v3, mean-pooled, and turned by C-Gate into a sparse convex mixture of rows of the frozen embedding table, which the partially adapted Qwen2.5-7B-Instruct decoder reads together with the text prompt.</title>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#97a1b1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>

  </defs>

  <!-- speech -->
  <g class="model-wave">
    <path d="M14 141v18M22 132v36M30 124v52M38 136v28M46 117v66M54 128v44M62 139v22M70 121v58M78 133v34M86 143v14"/>
  </g>
  <text class="model-note" x="50" y="204" text-anchor="middle">Speech</text>

  <!-- encoder + pooling -->

  <rect class="model-node" x="278" y="112" width="92" height="76" rx="8"/>
  <text class="model-label" x="324" y="146" text-anchor="middle">Mean pool</text>
  <text class="model-note" x="324" y="166" text-anchor="middle">stride 4</text>
  <path class="model-route model-route-blue" d="M374 150h22" marker-end="url(#ahb)"/>

  <!-- C-Gate -->
  <rect x="400" y="30" width="366" height="236" rx="10" fill="#fbfcfe" stroke="#7f9ccf" stroke-width="1.2"/>
  <text class="model-label" x="416" y="54" style="fill:#2456a6;font-weight:600">C-Gate</text>

  <path class="model-route model-route-blue" d="M486 150h26" marker-end="url(#ahb)"/>

  <g stroke="#c3cad6" stroke-width="1">

  <foreignObject x="628" y="269" width="180" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="model-math" style="font-size:11.5px;text-align:left">values: raw rows of <math-tex>E</math-tex></div></foreignObject>

  <foreignObject x="718" y="27" width="300" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="model-math" style="font-size:11.5px;text-align:center">text prompt, same table <math-tex>E</math-tex></div></foreignObject>

  <path class="model-route" d="M866 72v20" marker-end="url(#ah)"/>
  <path class="model-route model-route-blue" d="M716 150h74" marker-end="url(#ahb)"/>
  <rect class="model-stack" x="804" y="104" width="148" height="104" rx="8"/>
  <rect class="model-node" x="796" y="96" width="148" height="104" rx="8"/>

  <g>

    <rect class="model-token" x="982" y="179" width="10" height="10" rx="2"/>

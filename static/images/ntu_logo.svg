<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- NTU Official Seal - Simplified -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#8B1C23" stroke-width="3"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#8B1C23" stroke-width="1.5"/>
  <!-- Fu Bell (…) - NTU's iconic symbol -->
  <path d="M40 28 L40 58 Q40 72 50 76 Q60 72 60 58 L60 28 Z" fill="#8B1C23"/>
  <rect x="44" y="20" width="12" height="8" fill="#8B1C23"/>
  <ellipse cx="50" cy="20" rx="8" ry="3" fill="#8B1C23"/>
  <!-- Ring at bottom of bell -->
  <circle cx="50" cy="70" r="3" fill="#fff"/>
  <!-- NTU Text -->
  <text x="50" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8B1C23">NTU</text>
</svg>
